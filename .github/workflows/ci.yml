name: CI

on:
  push:
  pull_request:

env:
  # Tests run offline against committed fixtures; no browser needed.
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run format:check
      - run: node --test
